# A workflow to build fresh binaries.
# Builds ffmpeg and ffprobe on all OS & CPU combinations, then optionally
# attaches them to a release.
name: Build

on:
  # Validate every change that lands on the release branch.
  push:
    branches:
      - main

  # Runs when called from another workflow, such as the release or test
  # workflows.
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      qualify:
        description: Build a matched unpatched control and compare the previous release
        type: boolean
        default: false
      # If true, start a debug SSH server on failures.
      debug:
        required: false
        type: boolean
        default: false
      # If true, enable self-hosted runners in the build matrix.
      self_hosted:
        required: false
        type: boolean
        default: false

  # Runs on manual trigger.
  workflow_dispatch:
    inputs:
      qualify:
        description: Build a matched unpatched control and compare the previous release
        type: boolean
        default: false
      # If true, start a debug SSH server on failures.
      debug:
        required: false
        type: boolean
        default: false
      # If true, enable self-hosted runners in the build matrix.
      self_hosted:
        required: false
        type: boolean
        default: false


# NOTE: The versions of the software we build are stored in versions.txt.

# By default, run all commands in a bash shell.  On Windows, the default would
# otherwise be powershell.  Each shell command should begin with "set -e" (to
# make any failed command fail the script immediately) and "set -x" (to log
# what commands are being run).
defaults:
  run:
    shell: bash

jobs:
  # Configure the build matrix based on inputs.  The list of objects in the
  # build matrix contents can't be changed by conditionals, but it can be
  # computed by another job and deserialized.
  matrix_config:
    runs-on: ubuntu-latest
    outputs:
      MATRIX: ${{ steps.configure.outputs.MATRIX }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo-src
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Configure Build Matrix
        id: configure
        shell: node {0}
        run: |
          const fs = require('fs');
          const enableDebug = ${{ inputs.debug || false }};
          const enableSelfHosted = ${{ inputs.self_hosted || false }};

          // Use enableSelfHosted to decide what the build matrix below should
          // include.
          const buildMatrix = JSON.parse(fs.readFileSync("${{ github.workspace }}/repo-src/build-matrix.json"));
          const {hosted, selfHosted} = buildMatrix;
          const matrix = enableSelfHosted ? hosted.concat(selfHosted) : hosted;

          // Output a JSON object consumed by the build matrix below.
          fs.appendFileSync(
              process.env['GITHUB_OUTPUT'],
              `MATRIX=${ JSON.stringify(matrix) }\n`);

          // Log the outputs, for the sake of debugging this script.
          console.log({enableDebug, enableSelfHosted, matrix});

  # On several different hosts, build ffmpeg's dependencies, then ffmpeg itself.
  # The deps are all built as static libraries.
  build:
    needs: matrix_config
    strategy:
      # Let other matrix entries complete, so we have all results on failure
      # instead of just the first failure.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix_config.outputs.MATRIX) }}

    name: Build ${{ matrix.os_name }} ${{ matrix.target_arch }}
    runs-on: ${{ matrix.os }}
    env:
      QUALIFY: ${{ inputs.qualify || false }}
      SUFFIX: -${{ matrix.os_name }}-${{ matrix.target_arch }}${{ matrix.exe_ext }}

    steps:

      - uses: actions/checkout@v7
        with:
          path: repo-src
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install OS packages
        run: ./repo-src/build-scripts/00-packages.sh

      - name: Test strict patch application
        run: python3 -B -m unittest discover -s repo-src/tests -p 'test_prepare_ffmpeg.py' -v

      - name: Install x264
        run: ./repo-src/build-scripts/03-x264.sh

      - name: Install lame
        run: ./repo-src/build-scripts/05-lame.sh

      - name: Install mbedtls
        run: ./repo-src/build-scripts/07-mbedtls.sh

      - name: Install libwebp
        run: ./repo-src/build-scripts/06-libwebp.sh

      - name: Install freetype
        run: ./repo-src/build-scripts/08-freetype.sh

      - name: Install fontconfig
        run: ./repo-src/build-scripts/09-fontconfig.sh

      - name: Install harfbuzz
        run: ./repo-src/build-scripts/09a-harfbuzz.sh

      - name: Install fribidi
        run: ./repo-src/build-scripts/10-fribidi.sh

      - name: Install libass
        run: ./repo-src/build-scripts/11-libass.sh

      - name: Install dav1d
        run: bash ./repo-src/build-scripts/12-dav1d.sh

      - name: Build ffmpeg and ffprobe
        id: candidate_build
        run: ./repo-src/build-scripts/90-ffmpeg.sh

      - name: Verify required codecs
        run: ./repo-src/build-scripts/91-check-features.sh

      - name: Build matched unpatched control
        id: control_build
        if: inputs.qualify
        run: |
          ./repo-src/build-scripts/90-ffmpeg.sh control
          ./repo-src/build-scripts/91-check-features.sh ffmpeg-control
          ./repo-src/build-scripts/99-check-static.sh ffmpeg-control

      - name: Verify seek reference behavior and upstream regressions
        run: bash ./repo-src/build-scripts/92-check-seek-stream.sh

      - name: Compare previous release, unpatched control and candidate
        if: inputs.qualify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 repo-src/tests/fetch-baseline.py -- "$SUFFIX" baseline.noindex
          python3 repo-src/tests/compare-builds.py \
            "baseline.noindex/ffmpeg$SUFFIX" ffmpeg-control/ffmpeg ffmpeg/ffmpeg \
            ffmpeg/ffprobe "baseline.noindex/ffprobe$SUFFIX" ffmpeg-control/ffprobe \
            --work-dir seek-tests.noindex --report qualification.noindex/comparison.json

      - name: Run full FATE without external samples
        if: ${{ !cancelled() && inputs.qualify && steps.candidate_build.outcome == 'success' && steps.control_build.outcome == 'success' }}
        run: |
          set -uo pipefail
          make -C ffmpeg -k -j2 SAMPLES= fate 2>&1 | tee qualification.noindex/fate-full.log
          fate_status=${PIPESTATUS[0]}
          if [[ "$fate_status" -ne 0 ]]; then
            # Attribute a failure to upstream or the patch without hiding it.
            make -C ffmpeg-control -k -j2 SAMPLES= fate 2>&1 | tee qualification.noindex/fate-control.log
            exit "$fate_status"
          fi

      - name: Verify CPU fallback without AVX
        if: ${{ !cancelled() && inputs.qualify && runner.os == 'Linux' && steps.candidate_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          sudo apt-get install --yes qemu-user
          mkdir -p cpu.noindex
          for program in ffmpeg ffprobe; do
            printf '#!/bin/bash\nexec qemu-x86_64 -cpu Nehalem "%s" "$@"\n' \
              "$PWD/ffmpeg/$program" > "cpu.noindex/$program"
            chmod +x "cpu.noindex/$program"
          done
          bash repo-src/tests/check-av1.sh "$PWD/cpu.noindex/ffmpeg" "$PWD/cpu.noindex/ffprobe"
          python3 repo-src/tests/check-seek-stream.py cpu.noindex/ffmpeg cpu.noindex/ffprobe \
            --work-dir cpu.noindex --report qualification.noindex/cpu-no-avx.json

      - name: Prepare assets
        run: |
          set -e
          set -x

          mkdir assets
          python3 repo-src/tools/collect-provenance.py ffmpeg assets -- "$SUFFIX"
          if [[ "$QUALIFY" == true ]]; then
            python3 repo-src/tools/collect-provenance.py --control ffmpeg-control assets -- "$SUFFIX"
          fi
          for report in qualification.noindex/*; do
            name=$(basename "$report")
            cp "$report" "assets/${name%.*}$SUFFIX.${name##*.}"
          done

          # Checksums identify downloaded bytes; they are not signatures.
          cd assets
          wc -c *
          shasum -a 256 *
          md5sum *

      # This makes it possible to debug failures in the next step by
      # downloading binaries that fail the check for static linkage.
      - name: Upload assets as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries${{ env.SUFFIX }}
          path: assets/*

      - name: Check that executables are static
        run: ./repo-src/build-scripts/99-check-static.sh

      - name: Retain qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qualification-diagnostics${{ env.SUFFIX }}
          path: qualification.noindex/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare unqualified binaries for failure analysis
        if: failure()
        continue-on-error: true
        run: |
          set -e
          for source_directory in ffmpeg ffmpeg-control; do
            if [[ -x "$source_directory/ffmpeg" && -x "$source_directory/ffprobe" ]]; then
              arguments=("$source_directory" unqualified.noindex)
              if [[ "$source_directory" == ffmpeg-control ]]; then arguments=(--control "${arguments[@]}"); fi
              python3 repo-src/tools/collect-provenance.py "${arguments[@]}" -- "$SUFFIX"
            fi
          done

      - name: Retain unqualified binaries for failure analysis
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unqualified-binaries${{ env.SUFFIX }}
          path: unqualified.noindex/
          if-no-files-found: ignore
          retention-days: 7

      - name: Debug
        uses: mxschmitt/action-tmate@v3.24
        with:
          limit-access-to-actor: true
        if: failure() && inputs.debug
